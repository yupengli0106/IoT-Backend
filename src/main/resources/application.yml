spring:
  application:
    name: my-app

  # Alibaba MySQL DataSource
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${Aliyun_IP}:3306/myappDB
    username: ${Database_Username}
    password: ${Database_Password}

  # springSecurity
  security:
    user:
      name: admin
      password: admin

  # Redis
  data:
    redis:
      port: 6379
      host: ${Aliyun_IP}
      password: ${Redis_Password}

  # Cache
  cache:
    type: redis

  # use gmail to send email
  mail:
    default-encoding: utf-8
    host: smtp.gmail.com
    username: ${Gmail_Username}
    password: ${Gmail_App_Password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    port: 587

# Server configuration for deployment
server:
  port: 8080
  address: 0.0.0.0

# MQTT
mqtt:
  broker: tcp://${Aliyun_IP}:1883
  clientId: MyMqttClient
  username: ${Mqtt_Username}
  password: ${Mqtt_Password}


# Mybatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名转换 (create_time -> createTime)

# JWT Configuration - IMPORTANT: Set these in environment variables for production
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-please-change-for-production-use-minimum-32-characters}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  issuer: ${JWT_ISSUER:MyApp}

# Logging
logging:
  file:
    name: logs/MyApp.log
  level:
    root: INFO
    com.demo.myapp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

# IMPROVED: Spring Boot Actuator configuration for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops,mappings
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: MyApp
      environment: ${ENVIRONMENT:development}
  prometheus:
    metrics:
      export:
        enabled: true